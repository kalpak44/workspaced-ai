# The workspace's public web server. Requests to its public address, in
# ~/.config/workspaced/web/url, arrive here on port 80, so that listen line must stay.
# Apply a change with `web-server reload`, which tests it before restarting nginx.
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;

  # The root filesystem is read-only, so everything nginx writes goes under /tmp.
  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  # Lets a proxied app keep WebSocket connections open.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    root /home/workspace/web/public;
    index index.html;

    location / {
      try_files $uri $uri/ =404;
    }

    # To serve an app instead, run it as a service on a local port and replace the
    # location above with this one, naming that port:
    #
    # location / {
    #   proxy_pass http://127.0.0.1:5000;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    #   proxy_set_header X-Forwarded-Proto https;
    #   proxy_set_header Upgrade $http_upgrade;
    #   proxy_set_header Connection $connection_upgrade;
    # }
  }
}
