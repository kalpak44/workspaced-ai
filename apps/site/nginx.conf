server {
    listen 8080;
    root /usr/share/nginx/html;

    # Behind TLS-terminating proxies, an absolute redirect would point at http://...:8080.
    absolute_redirect off;

    # One canonical host, so search engines index one copy of every page.
    if ($host = "www.workspaced.online") {
        return 301 https://workspaced.online$request_uri;
    }

    # Nothing here is fingerprinted, so every file revalidates and a deploy shows at once.
    add_header Cache-Control "no-cache" always;
    # Every location below inherits these only while it sets no add_header of its own.
    include /etc/nginx/security-headers.conf;

    # Clean URLs: /support serves support.html, and /support.html redirects to /support.
    location / {
        if ($request_uri ~ ^/(.+)\.html$) {
            return 301 /$1;
        }
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
