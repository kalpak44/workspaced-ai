# Included at server level in nginx.conf; a location inherits these only while it has no
# add_header of its own. `always` puts them on the 404 page and on redirects too.

# No includeSubDomains: user VMs are named under this domain and may serve plain HTTP, which
# a browser told to use HTTPS for every subdomain could no longer reach.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), display-capture=(), fullscreen=(), clipboard-read=(), clipboard-write=(), accelerometer=(), gyroscope=(), magnetometer=(), browsing-topics=()" always;

# The site loads its own stylesheet, icon and one script, and nothing else. The JSON-LD blocks
# are data, never executed, so script-src does not apply to them.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
