# Everything this app serves lives under /api/v1, docs and health included, so the host
# root is left to the frontend.
server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: workspaced-ai-api
  threads:
    virtual:
      enabled: true

  # Errors answer as RFC 9457 problem details (application/problem+json), the shape
  # WorkspaceApi documents for every 4xx.
  mvc:
    problemdetails:
      enabled: true

  # Every value has a local-development default except the password: a fallback password
  # is one that reaches production unnoticed.
  datasource:
    url: jdbc:postgresql://${WORKSPACED_DB_HOST:localhost}:${WORKSPACED_DB_PORT:5432}/${WORKSPACED_DB_NAME:workspaced}
    username: ${WORKSPACED_DB_USERNAME:workspaced}
    password: ${WORKSPACED_DB_PASSWORD}
    hikari:
      pool-name: workspaced-pool

  jpa:
    # Flyway creates the tables; a mapping that drifts from them fails at startup instead
    # of being "fixed" by Hibernate in production.
    hibernate:
      ddl-auto: validate
    # No lazy loading during view rendering: every query runs inside the service's
    # transaction, where it can be seen.
    open-in-view: false

  # A page of users holds at most this many, whatever the client asks for.
  data:
    web:
      pageable:
        max-page-size: 100

workspaced:
  auth:
    # Signs the login tokens (HS256), so it must be at least 32 bytes. No default, like the
    # database password: every instance has to sign with the same key, or a token from one
    # is a 401 at the next.
    jwt-secret: ${WORKSPACED_JWT_SECRET}
    token-ttl: ${WORKSPACED_TOKEN_TTL:12h}
  # Workspace backups in S3-compatible storage. Left unset, as it is locally, backups are off
  # and every backup route answers 503 rather than the API failing to start.
  backup:
    endpoint: ${WORKSPACED_BACKUP_ENDPOINT:}
    bucket: ${WORKSPACED_BACKUP_BUCKET:workspace-backups}
    region: ${WORKSPACED_BACKUP_REGION:us-east-1}
    access-key: ${WORKSPACED_BACKUP_ACCESS_KEY:}
    secret-key: ${WORKSPACED_BACKUP_SECRET_KEY:}

  # Each workspace's nginx, public at https://<name>.<domain> through a Service named
  # web-<name>; routing the domain to those Services is the cluster's job. Left unset, as it
  # is locally, there is no web server to turn on and the setting answers 501.
  web-server:
    domain: ${WORKSPACED_WEB_SERVER_DOMAIN:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      # A pod that cannot reach its database takes no traffic; liveness leaves it out, so
      # a database outage does not restart every pod.
      group:
        readiness:
          include: readinessState,db

springdoc:
  show-actuator: true
  use-management-port: false
  api-docs:
    path: '/v3/api-docs'
    version: openapi_3_0
  swagger-ui:
    path: '/swagger-ui'
    operationsSorter: alpha
    tagsSorter: alpha
