# Everything this app serves lives under /api/v1, docs and health included, so the host
# root is left to the frontend.
server:
  servlet:
    context-path: /api/v1
  # TLS ends at the ingress, so the scheme and host come from its X-Forwarded headers: the
  # Auth0 callback must be the https URL the application allows, and the cookie Secure.
  forward-headers-strategy: native

spring:
  application:
    name: workspaced-ai-api
  threads:
    virtual:
      enabled: true

  # Errors answer as RFC 9457 problem details (application/problem+json), the shape
  # WorkspaceApi documents for every 4xx.
  mvc:
    problemdetails:
      enabled: true

  # Every value has a local-development default except the password: a fallback password
  # is one that reaches production unnoticed.
  datasource:
    url: jdbc:postgresql://${WORKSPACED_DB_HOST:localhost}:${WORKSPACED_DB_PORT:5432}/${WORKSPACED_DB_NAME:workspaced}
    username: ${WORKSPACED_DB_USERNAME:workspaced}
    password: ${WORKSPACED_DB_PASSWORD}
    hikari:
      pool-name: workspaced-pool

  jpa:
    # Flyway creates the tables; a mapping that drifts from them fails at startup instead
    # of being "fixed" by Hibernate in production.
    hibernate:
      ddl-auto: validate
    # No lazy loading during view rendering: every query runs inside the service's
    # transaction, where it can be seen.
    open-in-view: false

  # A page of users holds at most this many, whatever the client asks for.
  data:
    web:
      pageable:
        max-page-size: 100

workspaced:
  # The private service that creates the Hetzner VMs workspaces run on. Left unset, as it is
  # locally, workspace routes answer 503.
  vm-manager:
    url: ${WORKSPACED_VM_MANAGER_URL:}
  vm-pricing:
    # Added, in percent, to a VM's cost in the prices users who are not admins see.
    markup-percent: ${WORKSPACED_VM_MARKUP_PERCENT:35}
  # Every harness is reached through this service's tunnel to its VM. Left unset, as it is
  # locally, no workspace's harness answers.
  agent-hub:
    url: ${WORKSPACED_AGENT_HUB_URL:}
  # A user's own domains, pointed at their workspace. Without the key, which is the
  # domain-connect-private-key in Vault, every domain is set up by hand.
  domains:
    private-key: ${WORKSPACED_DOMAIN_CONNECT_PRIVATE_KEY:}
    app-url: ${WORKSPACED_APP_URL:https://ai.workspaced.online}
  # Mail sent as any address on the domain, through Mailjet. Left unset, as it is locally,
  # sending answers 503.
  mail:
    api-key: ${WORKSPACED_MAIL_API_KEY:}
    secret-key: ${WORKSPACED_MAIL_SECRET_KEY:}
  auth:
    # Signs the login tokens (HS256), so it must be at least 32 bytes. No default, like the
    # database password: every instance has to sign with the same key, or a token from one
    # is a 401 at the next.
    jwt-secret: ${WORKSPACED_JWT_SECRET}
    token-ttl: ${WORKSPACED_TOKEN_TTL:12h}
    # Auth0 signs users in. The client id is public, but the secret has no default, so a
    # missing one stops the start rather than every sign-in.
    issuer: ${WORKSPACED_AUTH_ISSUER:https://auth.workspaced.online/}
    client-id: ${WORKSPACED_AUTH_CLIENT_ID:dRdGOJHzotVdano2eR4VaQ2zSXnOltte}
    client-secret: ${WORKSPACED_AUTH_CLIENT_SECRET}
    # Comma-separated; each becomes an admin the first time it signs in.
    admin-emails: ${WORKSPACED_AUTH_ADMIN_EMAILS:}
  # Top-ups through Stripe Checkout. Left unset, as it is locally, the balance and its history
  # still answer and starting a top-up answers 503.
  billing:
    return-url: ${WORKSPACED_BILLING_RETURN_URL:http://localhost:5173/billing}
    # Charged on top of every top-up; the balance gets the amount before it.
    vat-percent: ${WORKSPACED_BILLING_VAT_PERCENT:20}
    # Taken from the balance, in EUR, to start a workspace paused for want of funds again.
    reactivation-fee: ${WORKSPACED_BILLING_REACTIVATION_FEE:5.00}
    # How long a workspace the balance cannot pay for stays paused, its VM shut down, before it
    # is deleted for good.
    paused-for: ${WORKSPACED_BILLING_PAUSED_FOR:3d}
    # How often started hours of workspaces are charged; each is charged once, however late.
    charge-interval: ${WORKSPACED_BILLING_CHARGE_INTERVAL:PT5M}
    stripe:
      secret-key: ${WORKSPACED_STRIPE_SECRET_KEY:}
      webhook-secret: ${WORKSPACED_STRIPE_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      # A pod that cannot reach its database takes no traffic; liveness leaves it out, so
      # a database outage does not restart every pod.
      group:
        readiness:
          include: readinessState,db

springdoc:
  show-actuator: true
  use-management-port: false
  api-docs:
    path: '/v3/api-docs'
    version: openapi_3_0
  swagger-ui:
    path: '/swagger-ui'
    operationsSorter: alpha
    tagsSorter: alpha
