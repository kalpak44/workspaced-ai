# Everything this app serves lives under /api/v1, docs and health included, so the host
# root is left to the frontend.
server:
  servlet:
    context-path: /api/v1
  # TLS ends at the ingress, so the scheme and host come from its X-Forwarded headers: the
  # Auth0 callback must be the https URL the application allows, and the cookie Secure.
  forward-headers-strategy: native

spring:
  application:
    name: workspaced-ai-api
  threads:
    virtual:
      enabled: true

  # Errors answer as RFC 9457 problem details (application/problem+json), the shape
  # WorkspaceApi documents for every 4xx.
  mvc:
    problemdetails:
      enabled: true

  # Every value has a local-development default except the password: a fallback password
  # is one that reaches production unnoticed.
  datasource:
    url: jdbc:postgresql://${WORKSPACED_DB_HOST:localhost}:${WORKSPACED_DB_PORT:5432}/${WORKSPACED_DB_NAME:workspaced}
    username: ${WORKSPACED_DB_USERNAME:workspaced}
    password: ${WORKSPACED_DB_PASSWORD}
    hikari:
      pool-name: workspaced-pool

  jpa:
    # Flyway creates the tables; a mapping that drifts from them fails at startup instead
    # of being "fixed" by Hibernate in production.
    hibernate:
      ddl-auto: validate
    # No lazy loading during view rendering: every query runs inside the service's
    # transaction, where it can be seen.
    open-in-view: false

  # A page of users holds at most this many, whatever the client asks for.
  data:
    web:
      pageable:
        max-page-size: 100

workspaced:
  # The private service that creates the Hetzner VMs workspaces run on. Left unset, as it is
  # locally, workspace routes answer 503.
  vm-manager:
    url: ${WORKSPACED_VM_MANAGER_URL:}
  # What a workspace can be created as: a fixed daily price, before VAT, for one Hetzner server
  # type each. The first is the default; a fallback plan is offered only while every other plan
  # is sold out. The site's pricing.html states these prices too.
  plans:
    offered:
      - name: Starter
        server-type: cx23
        daily-price: 0.35
      - name: Builder
        server-type: cx33
        daily-price: 0.55
      - name: Pro
        server-type: cx43
        daily-price: 0.95
      # Hetzner sells the cx line out everywhere for hours at a time; cpx22 is the same size,
      # usually in stock, and priced to pass the margin check below.
      - name: Starter Flex
        server-type: cpx22
        daily-price: 1.15
        fallback: true
    # A plan is withheld unless, after Stripe's fee, its price keeps this margin over its server's
    # cost with VAT, raised by Hetzner's hourly billing before the monthly cap.
    hourly-billing-factor: 1.155
    # Stripe's worst case in Bulgaria: a €5 top-up on a non-EEA card, 3.15% + €0.25 on the amount
    # with VAT, plus 0.4% for its invoice.
    stripe-fee-percent: 9.5
    min-margin-percent: 10
  # Both sides earn balance credit on an invited user's paid top-ups. The plan check above
  # counts both shares as extra server cost, so a plan stays profitable even when someone
  # invites themselves.
  referrals:
    enabled: true
    link: https://workspaced.online/
    referee:
      percent: 10
      cap: 10.00
      period: 90d
    referrer:
      percent: 10
      cap: 50.00
      period: 365d
  # Every harness is reached through this service's tunnel to its VM. Left unset, as it is
  # locally, no workspace's harness answers.
  agent-hub:
    url: ${WORKSPACED_AGENT_HUB_URL:}
  # A user's own domains, pointed at their workspace. Without the key, which is the
  # domain-connect-private-key in Vault, every domain is set up by hand.
  domains:
    private-key: ${WORKSPACED_DOMAIN_CONNECT_PRIVATE_KEY:}
    app-url: ${WORKSPACED_APP_URL:https://ai.workspaced.online}
    # Provider ids, comma-separated, that have taken our templates live, and zones that get
    # Domain Connect anywhere for testing. A provider answers for a template before it is live.
    live-providers: ${WORKSPACED_DOMAIN_CONNECT_PROVIDERS:}
    test-zones: ${WORKSPACED_DOMAIN_CONNECT_TEST_ZONES:}
  # Mail sent as any address on the domain, through Mailjet. Left unset, as it is locally,
  # sending answers 503.
  mail:
    api-key: ${WORKSPACED_MAIL_API_KEY:}
    secret-key: ${WORKSPACED_MAIL_SECRET_KEY:}
  auth:
    # Signs the session tokens issued after an Auth0 sign-in (HS256), and download links, so it
    # must be at least 32 bytes. No default, like the database password: every instance has to
    # sign with the same key, or a token from one is a 401 at the next.
    jwt-secret: ${WORKSPACED_JWT_SECRET}
    token-ttl: ${WORKSPACED_TOKEN_TTL:12h}
    # The Auth0 tenant and application users sign in with. No defaults, so an instance can only
    # sign in against the tenant it was configured for.
    issuer: ${WORKSPACED_AUTH_ISSUER}
    client-id: ${WORKSPACED_AUTH_CLIENT_ID}
    client-secret: ${WORKSPACED_AUTH_CLIENT_SECRET}
    # Profiles are read and names saved here, on the tenant's own domain: the custom one does
    # not serve the Management API.
    management-api: ${WORKSPACED_AUTH_MANAGEMENT_API}
    # Where mail links point and an unverified sign-up lands, and where signing out ends. Set
    # here rather than read from the request, whose host a client can choose.
    app-url: ${WORKSPACED_APP_URL:https://ai.workspaced.online}
    site-url: ${WORKSPACED_SITE_URL:https://workspaced.online}
  # Backend-only credential. Never pass it to web or harness containers. Each issued trial key
  # is hard-capped at $1 for its entire lifetime; missing config leaves provisioning unavailable.
  openrouter:
    management-key: ${WORKSPACED_OPENROUTER_MANAGEMENT_KEY:}
  # Each account's one free demo workspace, at the cheapest available size and never charged. at-once caps
  # how many run together, since every one is a VM the platform pays for.
  demo:
    length: ${WORKSPACED_DEMO_LENGTH:PT4H}
    at-once: ${WORKSPACED_DEMO_AT_ONCE:20}
    warn-before: ${WORKSPACED_DEMO_WARN_BEFORE:PT30M}
  # Top-ups through Stripe Checkout. Left unset, as it is locally, the balance and its history
  # still answer and starting a top-up answers 503.
  billing:
    return-url: ${WORKSPACED_BILLING_RETURN_URL:http://localhost:5173/billing}
    # Charged on top of every top-up; the balance gets the amount before it.
    vat-percent: ${WORKSPACED_BILLING_VAT_PERCENT:20}
    # Taken from the balance, in EUR, to start a workspace paused for want of funds again.
    reactivation-fee: ${WORKSPACED_BILLING_REACTIVATION_FEE:5.00}
    # How long a workspace the balance cannot pay for stays paused, its VM shut down, before it
    # is deleted for good.
    paused-for: ${WORKSPACED_BILLING_PAUSED_FOR:3d}
    # How long the balance must pay for every workspace, a new one included, before that one can
    # be created. Short, since the balance is prepaid and a shortfall only pauses workspaces.
    require-covered: ${WORKSPACED_BILLING_REQUIRE_COVERED:7d}
    # How often started hours of workspaces are charged; each is charged once, however late.
    charge-interval: ${WORKSPACED_BILLING_CHARGE_INTERVAL:PT5M}
    stripe:
      secret-key: ${WORKSPACED_STRIPE_SECRET_KEY:}
      webhook-secret: ${WORKSPACED_STRIPE_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      # A pod that cannot reach its database takes no traffic; liveness leaves it out, so
      # a database outage does not restart every pod.
      group:
        readiness:
          include: readinessState,db

springdoc:
  show-actuator: true
  use-management-port: false
  api-docs:
    path: '/v3/api-docs'
    version: openapi_3_0
  swagger-ui:
    path: '/swagger-ui'
    operationsSorter: alpha
    tagsSorter: alpha
