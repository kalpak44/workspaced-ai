# The tests' own signing key; production reads WORKSPACED_JWT_SECRET, which has no default.
workspaced.auth.jwt-secret=test-only-jwt-signing-key-not-for-production
# Tests run the expiry pass several times in a row; production keeps the lock 30s after each.
workspaced.session-ttl.cleanup-lock-at-least=PT0S
# A lock another instance holds is waited for this long before a 409, instead of 30s.
workspaced.locks.wait=PT1S
