# The tests' own signing key; production reads WORKSPACED_JWT_SECRET, which has no default.
workspaced.auth.jwt-secret=test-only-jwt-signing-key-not-for-production
# No test reaches Auth0: sign-in tests stop at the redirect, and tokens are issued directly.
workspaced.auth.issuer=https://auth.example.test/
workspaced.auth.client-id=test-client
workspaced.auth.client-secret=test-only-client-secret
workspaced.auth.app-url=https://ai.example.test
workspaced.auth.site-url=https://site.example.test
# The schema's own migrations, then the admin the tests sign in as.
spring.flyway.locations=classpath:db/migration,classpath:db/testdata
# Tests run the expiry pass several times in a row; production keeps the lock 30s after each.
workspaced.session-ttl.cleanup-lock-at-least=PT0S
# A lock another instance holds is waited for this long before a 409, instead of 30s.
workspaced.locks.wait=PT1S
