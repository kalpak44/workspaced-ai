<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Nothing here</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #18181b; --muted: #71717a; --line: #e4e4e7; }
    @media (prefers-color-scheme: dark) { :root { --bg: #09090b; --fg: #f4f4f5; --muted: #a1a1aa; --line: #27272a; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
      background: var(--bg); color: var(--fg); font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 28rem; width: 100%; border: 1px solid var(--line); border-radius: 0.75rem; padding: 1.5rem; }
    .code { font-size: 0.875rem; color: var(--muted); margin: 0 0 0.5rem; letter-spacing: 0.05em; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.5rem; }
    p { margin: 0; color: var(--muted); font-size: 0.9375rem; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Nothing is published here</h1>
    <p>No workspace is serving this address right now. If it is yours, start the workspace and turn on its web server in the workspace's settings.</p>
  </main>
</body>
</html>
