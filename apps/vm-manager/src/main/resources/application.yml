# Everything this app serves lives under /api/v1, docs and health included, on 8080 like
# the workspace API.
server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: workspaced-ai-vm-manager
  threads:
    virtual:
      enabled: true

  # Errors answer as RFC 9457 problem details (application/problem+json), the shape
  # VmApi documents for every 4xx.
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  show-actuator: true
  use-management-port: false
  api-docs:
    path: '/v3/api-docs'
    version: openapi_3_0
  swagger-ui:
    path: '/swagger-ui'
    operationsSorter: alpha
    tagsSorter: alpha

workspaced:
  hetzner:
    # A Read & Write token of the Hetzner Cloud project VMs live in. Unset, the app still
    # starts, and anything that needs Hetzner answers 503.
    token: ${WORKSPACED_HETZNER_TOKEN:}
    # Nuremberg, Germany. fsn1 (Falkenstein) is the other German location.
    location: ${WORKSPACED_HETZNER_LOCATION:nbg1}
    image: ${WORKSPACED_HETZNER_IMAGE:ubuntu-24.04}
    # Comma-separated names of project SSH keys put on every VM. Empty, Hetzner emails a root
    # password for each one instead.
    ssh-keys: ${WORKSPACED_HETZNER_SSH_KEYS:}
    # Every VM is created behind this Cloud Firewall, made with no rules when it is missing, so
    # no inbound connection reaches a VM; outbound still works.
    firewall: ${WORKSPACED_HETZNER_FIREWALL:workspaced-ai-vms}
  vm:
    # The sizes offered, default first. Specs and prices come from Hetzner.
    server-types: ${WORKSPACED_VM_SERVER_TYPES:cx23,cx33}
