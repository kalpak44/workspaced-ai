# Included by every location in nginx.conf: a location with an add_header of its own drops
# every header it would otherwise inherit. `always` puts them on errors and 404s too.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;

# Dictation uses the Web Speech API, which needs the microphone; the copy buttons write to the
# clipboard. Everything else the page never asks for is refused outright.
add_header Permissions-Policy "microphone=(self), clipboard-write=(self), clipboard-read=(), camera=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), display-capture=(), fullscreen=(), accelerometer=(), gyroscope=(), magnetometer=(), browsing-topics=()" always;

# Sources beyond 'self', each because the app needs it:
#   img-src https: data: recipes, chat and the mail preview show remote and inlined images;
#     avatars come from Gravatar or Auth0
#   style-src 'unsafe-inline': the editor and the terminal inject <style> elements at runtime
#   connect-src https://openrouter.ai: the OpenRouter key exchange goes there directly, never
#     through the API; event streams and the terminal socket are same-origin
# Scripts stay 'self' alone: the bundle has no inline script, eval, worker or wasm.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://openrouter.ai; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
