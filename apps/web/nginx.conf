server {
    listen 8080;
    root /usr/share/nginx/html;

    include /etc/nginx/security-headers.conf;

    # Vite fingerprints everything under /assets, so a changed file always has a new name.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every page src/lib/routes.ts can parse, plus the two the API and OpenRouter send the
    # browser to. A new top-level section is a change here too; test/routes.test.ts fails
    # until it is. index.html points at the current fingerprints, so it is never cached.
    location ~ ^/(settings|billing|notifications|store|workspaces|verify-email|connect/openrouter)(/|$) {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Anything else is a real file or a 404. The app still renders on that 404, so a mistyped
    # link lands somewhere usable, while a scanner's probe no longer reads as a hit.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
        error_page 404 /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
